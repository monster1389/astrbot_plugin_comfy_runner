<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>工作流与映射规则</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-heading">
          <h1>工作流与工具契约</h1>
          <span id="summary-stats" class="summary-stats">加载中...</span>
        </div>
        <div id="workflow-dir-wrap" class="dir-pill" title="">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1.5 3.5A1.5 1.5 0 0 1 3 2h3.17a1.5 1.5 0 0 1 1.06.44l.83.83c.14.14.33.23.53.23H13A1.5 1.5 0 0 1 14.5 5v7.5A1.5 1.5 0 0 1 13 14H3a1.5 1.5 0 0 1-1.5-1.5v-9Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          </svg>
          <code id="workflow-dir">读取中</code>
        </div>
      </div>
      <div class="topbar-actions">
        <input id="upload-input" type="file" accept=".json" hidden />
        <button id="btn-check-remote" type="button" class="btn">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.66M13.5 2.5v2.75h-2.75" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>全部远端核对</span>
        </button>
        <button id="btn-import" type="button" class="btn btn-primary">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 10V2.5M8 2.5L5 5.5M8 2.5L11 5.5M2.5 11v1.5A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5V11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>导入工作流</span>
        </button>
      </div>
    </header>

    <div id="global-toast" class="toast" hidden role="status" aria-live="polite"></div>

    <main class="layout">
      <aside class="sidebar">
        <div class="search-box">
          <svg class="icon search-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M10.5 10.5L13.8 13.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="搜索工作流、工具名或描述..."
            autocomplete="off"
          />
        </div>
        <div id="status-filters" class="filter-row" role="tablist" aria-label="按状态筛选"></div>
        <div id="workflow-list" class="workflow-list"></div>
      </aside>

      <section id="workspace" class="workspace">
        <div class="empty-state">
          <div class="empty-card">
            <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M14 2v5h5M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <h2>选择一个工作流开始配置</h2>
            <p>从左侧列表挑选工作流，或将 ComfyUI API 格式的 <code>.json</code> 文件直接拖入页面导入。</p>
            <button type="button" class="btn btn-primary" data-empty-import="true">导入工作流</button>
          </div>
        </div>
      </section>
    </main>

    <div id="modal-root" class="modal-backdrop" hidden></div>
    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-box">
        <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V4m0 0-4 4m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>松开以上传 ComfyUI API 格式工作流（.json）</p>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
